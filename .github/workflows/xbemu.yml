name: XBemu release

# Builds xemu.exe and the launcher, and the Mac app, and publishes them as a
# release that the launcher and the Mac app offer to players as an update.
#
# A release is made when the main branch changes, from main exactly as it is.
# A new xemu release is never merged into a release here: the daily check
# merges it into a copy of main, builds that, and keeps it as a draft release
# (only people who can push to this repository see drafts; players never get
# them), with the xemu changes it brings in the draft's notes and an issue
# pointing to it. When it does not merge cleanly the issue says so and nothing
# is built. Taking the xemu release into a real build is a merge done by hand
# and pushed to main.
#
# A push whose shader state headers no longer match .github/shader-state.txt
# releases nothing (see that file): the shader lists would stop loading.
#
# The Windows files are published as soon as they are built. The Mac and
# Linux apps take longer; their files are added to the same release when
# each is done, and a failed Mac or Linux build leaves the release without
# it. The systems' files never share a name: launchers read version.txt and
# XBemu-update.zip, the Mac app mac-version.txt and
# XBemu-mac-update.zip, the Linux app linux-version.txt and
# XBemu-linux-update.tar.gz.
#
# A push to mac-build or linux-build runs everything without publishing: the
# would-be release files are kept as downloads on the run's page (Artifacts).
#
# Versions and builds: XBemu is "v0.1 build 7". The version line (0.1) is in
# xbemu/VERSION; the build number goes up by one with every release, beta or
# stable, and is the tag: xbemu-7. Its version files say build=7,
# release=0.1 and channel=beta or channel=stable.
#
# Channels: a push publishes nothing unless its head commit has a line
#   Release-Channel: beta     a beta: a pre-release, never "latest". Only
#                             players on Beta (Help > Versions & Updates, or
#                             the update window) are offered it.
#   Release-Channel: stable   a stable build: the latest release, offered to
#                             everyone.
# (or the "channel" input when run by hand). Without it the run builds
# everything and keeps the files as downloads on the run's page (Artifacts).
# Publishing goes through the GitHub environment of the same name ("beta" or
# "stable"), so each channel shows under Deployments, and protection rules
# set on an environment (such as required reviewers on "stable") hold the
# release until approved. A beta that proved itself becomes stable without a
# new build: run "XBemu promote" (xbemu-promote.yml) with its build number.
#
# One system only: "Release-Systems: mac" (or "mac linux", "windows"...) in
# the same commit builds only those systems; the others get the files of the
# newest release of that channel (for a stable build: the newest stable),
# copied unchanged with their version files, so they see nothing new. The
# notes say which systems it is for in a "<!-- systems: mac -->" line, which
# the Versions window reads. To withdraw a release, turn it back into a draft,
# or add a line "Broken: why" to its notes (listed greyed out, not offered).

on:
  push:
    branches: [main, mac-build, linux-build]
    paths-ignore:
      - '**.md'
      - 'xbemu/docs/**'
      - 'xbemu/release-fixes/**'
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Release even when nothing changed
        type: boolean
        default: false
      xemu_test:
        description: Make the draft test build for the latest xemu release now
        type: boolean
        default: false
      channel:
        description: Publish as (none builds without publishing)
        type: choice
        options: [none, beta, stable]
        default: none

permissions:
  contents: write
  issues: write

concurrency:
  group: xbemu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check for changes and package the source
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      draft: ${{ steps.plan.outputs.draft }}
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.plan.outputs.channel }}
      release_line: ${{ steps.plan.outputs.release_line }}
      label: ${{ steps.plan.outputs.label }}
      systems: ${{ steps.plan.outputs.systems }}
      prev_tag: ${{ steps.plan.outputs.prev_tag }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.merge.outputs.version }}
      upstream: ${{ steps.merge.outputs.upstream }}
      commit: ${{ steps.merge.outputs.commit }}
      image: ${{ steps.merge.outputs.image }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Not the upstream remote, which gh would prefer
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Clone tree
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        fetch-depth: 0
    - name: Merge the latest xemu release (draft test builds only)
      id: merge
      env:
        XEMU_TEST: ${{ github.event_name == 'schedule' || inputs.xemu_test == true }}
        FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Files this repository replaces keep its version
        git config merge.ours.driver true
        printf '%s merge=ours\n' README.md >> .git/info/attributes

        git remote add upstream https://github.com/xemu-project/xemu.git
        git fetch --quiet --tags upstream master
        commit=$(git rev-parse HEAD)
        # The xemu release main is based on
        based=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
        upstream=$based
        mode=release
        mkdir -p meta

        if [ "$XEMU_TEST" = true ]; then
          latest=$(gh api repos/xemu-project/xemu/releases/latest --jq .tag_name)
          mode=none
          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "Main already has xemu $latest."
          elif gh release view "xemu-$latest-test" >/dev/null 2>&1 && [ "$FORCE" != true ]; then
            echo "The draft test build for xemu $latest is already made."
          else
            mode=draft
            upstream=$latest
            # What the draft's notes and issue say about this xemu release
            mb=$(git merge-base HEAD "$latest")
            theirs=$(git diff --name-only "$mb" "$latest")
            ours=$(git diff --name-only "$mb" HEAD)
            {
              echo "Main ($(git rev-parse --short HEAD), xemu ${based#v}) with xemu ${latest#v} merged in. Not released to players."
              echo
              echo "Release notes: https://github.com/xemu-project/xemu/releases/tag/$latest"
              echo
              if echo "$theirs" | grep -q -x -e 'hw/xbox/nv2a/pgraph/glsl/shaders.h' \
                  -e 'hw/xbox/nv2a/pgraph/glsl/vsh.h' -e 'hw/xbox/nv2a/pgraph/glsl/psh.h'; then
                echo "**Shader state changed** (shaders.h, vsh.h or psh.h): check that shader-list.bin still loads (\"does not match this emulator\" in xemu.log means precache is off)."
                echo
              fi
              echo "### Files both xemu and XBemu changed"
              echo
              echo '```'
              comm -12 <(echo "$theirs" | sort) <(echo "$ours" | sort) || true
              echo '```'
              echo
              echo "### xemu changes not in main yet"
              echo
              git log --no-merges --format='- %s (%h)' "HEAD..$latest" | head -n 200 || true
            } > meta/xemu.md
            echo "Merging xemu $latest"
            # XBemu has none of xemu's own workflows (they would publish to
            # xemu's website and PPA): ones xemu changed come back as
            # modify/delete conflicts, which are dropped again here
            if ! git merge --no-edit "$latest"; then
              for f in $(git diff --name-only --diff-filter=U -- .github/workflows); do
                if [ "$f" != .github/workflows/xbemu.yml ] && ! git cat-file -e "HEAD:$f" 2>/dev/null; then
                  git rm --quiet "$f"
                fi
              done
              if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git commit --quiet --no-edit
              fi
            fi
            if [ -f .git/MERGE_HEAD ]; then
              files=$(git diff --name-only --diff-filter=U)
              title="Update to xemu $latest needs a manual merge"
              open=$(gh issue list --state open --search "\"$title\" in:title" \
                     --json number --jq 'length')
              if [ "$open" = "0" ]; then
                gh issue create --title "$title" --body "xemu $latest does not merge cleanly into main, so no test build was made. Nothing was released.

        Files with conflicts:

        \`\`\`
        $files
        \`\`\`

        $(cat meta/xemu.md)"
              fi
              exit 1
            fi
          fi
        fi

        version=$(git describe --tags --match 'v*' | cut -c 2-)
        # The toolchain image the xemu Windows build uses
        # (from xemu's own workflow at the xemu release this build is on)
        tag=$({ git show "$upstream:.github/workflows/build-windows.yml" 2>/dev/null |
                grep -o -e '-gcc:sha-[0-9a-f]*' || true; } | head -n 1)
        image="xemu-win64-toolchain${tag:--gcc:sha-2881edd}"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "image=ghcr.io/xemu-project/$image" >> "$GITHUB_OUTPUT"
    # Drafts are allowed through: their notes warn about this instead
    - name: Check the shader list format
      if: steps.merge.outputs.mode == 'release'
      run: |
        set -euo pipefail
        files="hw/xbox/nv2a/pgraph/glsl/shaders.h hw/xbox/nv2a/pgraph/glsl/vsh.h
               hw/xbox/nv2a/pgraph/glsl/geom.h hw/xbox/nv2a/pgraph/glsl/psh.h
               hw/xbox/nv2a/pgraph/vsh_regs.h hw/xbox/nv2a/pgraph/psh_regs.h"
        want=$(grep -v -e '^#' -e '^[[:space:]]*$' .github/shader-state.txt | head -n 1 | tr -d '[:space:]')
        got=$(for f in $files; do git show "HEAD:$f"; done | sha256sum | cut -d' ' -f1)
        if [ "$want" != "$got" ]; then
          echo "::error title=Shader state changed, nothing released::The ShaderState headers changed, so xemu would reject shader-list.bin and players' learned shader lists and precache would turn off. Ship a converter for both lists in this build if the layout changed, then put this line in .github/shader-state.txt: $got"
          exit 1
        fi
        echo "Shader state headers unchanged ($got)."
    - name: Compare with the latest release
      id: plan
      env:
        MODE: ${{ steps.merge.outputs.mode }}
        UPSTREAM: ${{ steps.merge.outputs.upstream }}
        COMMIT: ${{ steps.merge.outputs.commit }}
        FORCE: ${{ inputs.force }}
        CHANNEL_INPUT: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        mkdir -p prev meta
        {
          echo "channel="
          echo "systems=windows mac linux"
        } >> "$GITHUB_OUTPUT"
        if [ "$MODE" = none ]; then
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$MODE" = draft ]; then
          # No build number: a launcher given this build by hand still takes
          # the next real build
          cp meta/xemu.md meta/changes.md
          echo "Test build with xemu ${UPSTREAM#v}, not released" > meta/notes.txt
          {
            echo "release=true"
            echo "publish=false"
            echo "draft=true"
            echo "build="
            echo "label="
            echo "tag=xemu-$UPSTREAM-test"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "draft=false" >> "$GITHUB_OUTPUT"
        # The version line, such as 0.1
        release_line=$(tr -d ' \r\n' < xbemu/VERSION)
        if ! echo "$release_line" | grep -Eq '^[0-9]+\.[0-9]+$'; then
          echo "::error title=Bad xbemu/VERSION::It must hold a version such as 0.1, not \"$release_line\""
          exit 1
        fi
        echo "release_line=$release_line" >> "$GITHUB_OUTPUT"

        # "Release-Channel: beta" or "stable" in the head commit's message
        # (or the channel input): publish to that channel; none builds only
        channel=$(git log -1 --format=%B "$COMMIT" |
                  sed -n 's/^Release-Channel:[[:space:]]*//Ip' | head -n 1 |
                  tr 'A-Z' 'a-z' | xargs || true)
        if [ -z "$channel" ] && [ -n "${CHANNEL_INPUT:-}" ] && [ "$CHANNEL_INPUT" != none ]; then
          channel=$CHANNEL_INPUT
        fi
        case "$channel" in
          ""|beta|stable) ;;
          *) echo "::error title=Unknown Release-Channel::$channel (use beta or stable)"
             exit 1 ;;
        esac

        # Every published release numbers the next one: the newest build of
        # either channel. A partial build copies from the newest release of
        # its own channel (a beta: the newest of either)
        releases=$(gh release list --limit 200 --json tagName,isDraft,isPrerelease \
                   --jq '.[] | select(.isDraft | not) | "\(.tagName) \(.isPrerelease)"' \
                   2>/dev/null || true)
        last_build=$(echo "$releases" | sed -n 's/^xbemu-\([0-9][0-9]*\) .*/\1/p' | sort -n | tail -n 1)
        stable_build=$(echo "$releases" | sed -n 's/^xbemu-\([0-9][0-9]*\) false$/\1/p' | sort -n | tail -n 1)
        if [ "$channel" = stable ]; then
          prev_tag=${stable_build:+xbemu-$stable_build}
        else
          prev_tag=${last_build:+xbemu-$last_build}
        fi
        if [ -n "$prev_tag" ]; then
          gh release download "$prev_tag" --pattern version.txt --dir prev 2>/dev/null || true
        fi
        field() {
          { grep -m 1 "^$1=" prev/version.txt 2>/dev/null || true; } | cut -d= -f2- | tr -d '\r'
        }
        prev_build=${prev_tag#xbemu-}
        prev_commit=$(field commit)
        prev_upstream=$(field upstream)
        if [ -n "$prev_tag" ]; then
          prev_commit=$(git rev-list -n 1 "$prev_tag" 2>/dev/null || echo "$prev_commit")
        fi
        echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

        # "Release-Systems: mac linux" (or the older "Release-Sub:"): only
        # those systems are built
        systems=$(git log -1 --format=%B "$COMMIT" |
                  sed -n 's/^Release-\(Systems\|Sub\):[[:space:]]*//Ip' | head -n 1 |
                  tr 'A-Z,' 'a-z ' | xargs || true)
        for s in $systems; do
          case "$s" in
            windows|mac|linux) ;;
            *) echo "::error title=Unknown system in Release-Systems::$s (use windows, mac or linux)"
               exit 1 ;;
          esac
        done
        if [ -n "$systems" ] && [ -z "$prev_tag" ]; then
          echo "::error title=No release to copy the other systems from::Release-Systems needs a published ${channel:-} release first"
          exit 1
        fi

        if [ "$prev_commit" = "$COMMIT" ] && [ "$prev_upstream" = "$UPSTREAM" ] &&
           [ "$FORCE" != "true" ]; then
          echo "Build $prev_build is current."
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        : > meta/changes.md
        if [ -z "$prev_build" ]; then
          echo "- First build published from this repository" >> meta/changes.md
        fi
        # Only a newer xemu: build 16 was made with v0.8.137 merged at build
        # time, while main itself was still on v0.8.136
        if [ -n "$prev_upstream" ] && [ "$prev_upstream" != "$UPSTREAM" ] &&
           [ "$(printf '%s\n' "$prev_upstream" "$UPSTREAM" | sort -V | tail -n 1)" = "$UPSTREAM" ]; then
          echo "- Updated to xemu release $UPSTREAM" >> meta/changes.md
        fi
        # When the head commit has "Change:" lines, those alone (after its
        # subject) are the notes, also on a first release
        head_changes=$(git log -1 --format='%(trailers:key=Change,valueonly)' "$COMMIT" |
                       sed '/^[[:space:]]*$/d')
        if [ -n "$head_changes" ]; then
          {
            git log -1 --format='- %s' "$COMMIT"
            echo "$head_changes" | sed 's/^/- /'
          } | head -n 20 > meta/changes.md
        elif [ -n "$prev_commit" ] && git cat-file -e "$prev_commit^{commit}" 2>/dev/null; then
          # Only player-facing lines: subjects that start with a lowercase
          # code area ("ci:", "nv2a:", "i386/tcg:", "make-package.py:") are
          # for developers. "Mac:" lines stay. A "Change: ..." line in a
          # commit's message adds a line of its own, to say more than the
          # subject does.
          git log --no-merges --first-parent --format='%H' "$prev_commit..$COMMIT" |
              while read -r c; do
                git log -1 --format='- %s' "$c" |
                    { grep -Ev '^- [a-z0-9][A-Za-z0-9/._-]*: ' || true; }
                git log -1 --format='%(trailers:key=Change,valueonly)' "$c" |
                    sed '/^[[:space:]]*$/d; s/^/- /'
              done | head -n 20 >> meta/changes.md
        fi
        head -n 1 meta/changes.md | cut -c 3- > meta/notes.txt

        echo "release=true" >> "$GITHUB_OUTPUT"
        build=$(( ${last_build:-0} + 1 ))
        systems=${systems:-windows mac linux}
        label="v$release_line build $build"
        if [ "$channel" = beta ]; then
          label="$label beta"
        fi
        echo "$label for: $systems${prev_tag:+ (the rest copied from $prev_tag)}"
        {
          echo "build=$build"
          echo "channel=$channel"
          echo "label=$label"
          echo "systems=$systems"
          echo "tag=xbemu-$build"
        } >> "$GITHUB_OUTPUT"
        # Only main publishes, and only with a channel; the rest are test runs
        if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$channel" ]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "No Release-Channel line (or not main): building without publishing."
          echo "publish=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Install dependencies
      if: steps.plan.outputs.release == 'true'
      run: sudo apt-get install meson
    - name: Create source package
      if: steps.plan.outputs.release == 'true'
      env:
        VERSION: ${{ steps.merge.outputs.version }}
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        pkg_name="xemu-${VERSION}"
        ./scripts/archive-source.sh "${pkg_name}.tar" "./${pkg_name}/"
        git rev-parse HEAD | tr -d '\n' > XEMU_COMMIT
        echo -n "${VERSION}" > XEMU_VERSION
        tar -r --file "${pkg_name}.tar" --transform "s,^./,./${pkg_name}/," ./XEMU_COMMIT ./XEMU_VERSION
        zstd "${pkg_name}.tar"
    - name: Upload source package
      if: steps.plan.outputs.release == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: src
        path: xemu-${{ steps.merge.outputs.version }}.tar.zst
        compression-level: 0
    - name: Upload release notes
      if: steps.plan.outputs.release == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: meta
        path: meta
    # The full packages' new console disk: XBemu's own blank disk (no files
    # from anyone; the XBL Dashboard installs on first start)
    - name: Make the blank hard disk
      if: steps.plan.outputs.release == 'true'
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -qy qemu-utils
        python3 xbemu/tools/make-blank-hdd.py blank.raw
        mkdir -p blank
        qemu-img convert -O qcow2 blank.raw blank/xbox_hdd.qcow2
        rm blank.raw
        ls -l blank
    - name: Upload the blank hard disk
      if: steps.plan.outputs.release == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blank-hdd
        path: blank

  build:
    name: Build xemu.exe
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && contains(needs.prepare.outputs.systems, 'windows')
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: /tmp/xemu-lto-ccache
      CROSSPREFIX: x86_64-w64-mingw32.static-
      CROSSAR: x86_64-w64-mingw32.static-gcc-ar
    steps:
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: src
    - name: Install curl
      run: |
        apt-get update
        apt-get install -qy curl zstd
    - name: Extract source package
      run: tar -xf xemu-${{ needs.prepare.outputs.version }}.tar.zst --strip-components=2
    - name: Initialize compiler cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: |
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-xbemu-wincross-${{ github.sha }}-${{ github.run_id }}
        restore-keys: cache-xbemu-wincross-
    - name: Compile
      run: |
        mkdir -p "${CCACHE_DIR}" "${LTO_CACHE_DIR}"
        ./build.sh -p win64-cross \
            --extra-cflags="-flto-incremental=${LTO_CACHE_DIR} -flto-partition=cache" \
            -Db_lto=true \
            -Dx86_version=3 \
            --enable-whpx
    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: xemu
        path: dist

  # Publishing goes through the channel's GitHub environment ("beta" or
  # "stable"): it is recorded under Deployments, and its protection rules
  # (required reviewers, wait timer, allowed branches) hold the release until
  # they pass. Set them in Settings > Environments.
  deploy:
    name: Approve the ${{ needs.prepare.outputs.channel }} release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.channel }}
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    steps:
    - name: Channel
      run: echo "Publishing ${{ needs.prepare.outputs.label }} (${{ needs.prepare.outputs.tag }}) to ${{ needs.prepare.outputs.channel }}"

  release:
    name: Package and release
    needs: [prepare, build, deploy]
    # Also when a partial build leaves Windows out (no xemu.exe built); a
    # published release only after its channel's environment let it through
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.release == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.deploy.result == 'success' || (needs.deploy.result == 'skipped' && needs.prepare.outputs.publish != 'true'))
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Not the upstream remote, which gh would prefer
      GH_REPO: ${{ github.repository }}
      BUILD: ${{ needs.prepare.outputs.build }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_LINE: ${{ needs.prepare.outputs.release_line }}
      LABEL: ${{ needs.prepare.outputs.label }}
      SYSTEMS: ${{ needs.prepare.outputs.systems }}
      PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM: ${{ needs.prepare.outputs.upstream }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
    - name: Clone the launcher and package files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        ref: ${{ needs.prepare.outputs.commit }}
        sparse-checkout: |
          xbemu
          ui/icons
          data
    - name: Download xemu.exe
      if: contains(needs.prepare.outputs.systems, 'windows')
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: xemu
        path: pkg/system
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: src
        path: src
    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: meta
        path: meta
    - name: Download the blank hard disk
      if: contains(needs.prepare.outputs.systems, 'windows')
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: blank-hdd
        path: blank
    - name: Build the launcher
      if: contains(needs.prepare.outputs.systems, 'windows')
      shell: pwsh
      run: |
        & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ `
            "/win32icon:ui\icons\xbemu.ico" "/resource:data\xbemu_logo.png,xbemu_logo.png" `
            "/out:pkg\XBemu.exe" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll `
            xbemu\package\Launcher.cs
        if ($LASTEXITCODE) { exit 1 }
    - name: Package
      if: contains(needs.prepare.outputs.systems, 'windows')
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        cp xbemu/package/README.txt pkg/README.txt
        cp "xbemu/package/Start over.bat" "pkg/system/Start over.bat"
        cp xbemu/package/Launcher.cs pkg/system/Launcher-source.cs
        cp xbemu/package/shader-list.bin pkg/system/shader-list.bin
        # OXOS, the open-source BIOS XBemu runs by default (GPL-2.0, source:
        # the "source" line of oxos.txt): the version this build was tested
        # with, taken from its release and checked against oxos.txt
        cp xbemu/package/oxos.txt pkg/system/oxos.txt
        oxos() { sed -n "s/^$1=//p" xbemu/package/oxos.txt | tr -d '\r'; }
        curl -fsSL -o oxos.zip \
            "https://github.com/kooscode/oxos/releases/download/$(oxos tag)/$(oxos zip)"
        mkdir -p pkg/system/bios
        7z e -so oxos.zip "$(oxos file)" > "pkg/system/bios/oxos-$(oxos tag).bin"
        echo "$(oxos sha256)  pkg/system/bios/oxos-$(oxos tag).bin" | sha256sum -c -
        rm oxos.zip
        # XBL Dashboard installer: its creator's own work, shipped with their
        # permission. xemu runs it once to make XBL Dashboard the dashboard.
        cp "xbemu/package/XBL Dashboard Installer.iso" \
            "pkg/system/XBL Dashboard Installer.iso"
        notes=$(cat meta/notes.txt 2>/dev/null || true)
        printf 'build=%s\nrelease=%s\nchannel=%s\nxemu=%s\nversion=%s\ndate=%s\ncommit=%s\nupstream=%s\nnotes=%s\n' \
            "$BUILD" "$RELEASE_LINE" "${CHANNEL:-test}" "${UPSTREAM#v}" "$VERSION" "$(date -u +%Y-%m-%d)" "$COMMIT" "$UPSTREAM" "$notes" \
            > pkg/system/version.txt
        # Every line of "What changed", which the app shows after an update
        { sed -n 's/^- /change=/p' meta/changes.md 2>/dev/null || true; } >> pkg/system/version.txt
        (cd pkg && 7z a -tzip -bso0 ../XBemu-update.zip .)
        cp pkg/system/version.txt version.txt
        echo "sha256=$(sha256sum XBemu-update.zip | cut -d' ' -f1)" >> version.txt
        mv src/*.tar.zst "XBemu-source-$TAG.tar.zst"
        cat version.txt

        # The full package for new players: the same files in an XBemu
        # folder, plus the blank disk a new console starts from and the
        # games folder. Nothing in it may be Microsoft's or a used console's
        full="XBemu-win-${BUILD:-test}-full.zip"
        mkdir -p full
        cp -a pkg full/XBemu
        mkdir -p full/XBemu/system/fresh full/XBemu/games
        cp blank/xbox_hdd.qcow2 full/XBemu/system/fresh/xbox_hdd.qcow2
        echo "Copy your game disc images (.iso) into this folder." \
            > "full/XBemu/games/Put your game disc images here.txt"
        bad=$(cd full && find XBemu -type f | grep -iE 'complex_4627|mcpx|eeprom\.bin|xboxdash|xbl dashboard(\.| loader)|black arrow|rainbow six|xbox_hdd\.qcow2' |
              grep -v '^XBemu/system/fresh/xbox_hdd\.qcow2$' || true)
        if [ -n "$bad" ]; then
          echo "::error title=File that must never ship::$bad"
          exit 1
        fi
        (cd full && 7z a -tzip -bso0 "../$full" XBemu)
        ls -l "$full"
        echo "FULL_ZIP=$full" >> "$GITHUB_ENV"
    # A sub build without Windows: the newest release's Windows files, so
    # Windows players see no new build
    - name: Copy the Windows files of the build before
      if: "!contains(needs.prepare.outputs.systems, 'windows')"
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        gh release download "$PREV_TAG" --pattern version.txt --pattern XBemu-update.zip \
            --pattern 'XBemu-win-*-full.zip'
        mv src/*.tar.zst "XBemu-source-$TAG.tar.zst"
        full=$(ls XBemu-win-*-full.zip 2>/dev/null | head -n 1 || true)
        if [ -n "$full" ]; then
          echo "FULL_ZIP=$full" >> "$GITHUB_ENV"
        fi
        cat version.txt
    - name: Write the draft's notes
      if: needs.prepare.outputs.draft == 'true'
      shell: bash
      run: |
        {
          echo "**Draft test build, not released.** Players never see drafts. To test it, unzip \`XBemu-update.zip\` over a copy of a XBemu folder; it has no build number, so that copy's launcher still offers the next real build."
          echo
          echo "To take this xemu release, merge it by hand, test, and push to main; delete this draft afterwards."
          echo
          cat meta/changes.md
        } > notes.md
    - name: Write release notes
      if: needs.prepare.outputs.draft != 'true'
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        # Mac and Linux add their files later and write the notes again
        IMAGES_REF=$COMMIT bash xbemu/tools/release-notes.sh version.txt meta/changes.md \
            XBemu-update.zip version.txt ${FULL_ZIP:+"$FULL_ZIP"} "XBemu-source-$TAG.tar.zst" > notes.md
        cat notes.md
    - name: Keep the test build
      if: needs.prepare.outputs.publish != 'true' && needs.prepare.outputs.draft != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: XBemu-windows-test
        path: |
          XBemu-update.zip
          XBemu-win-*-full.zip
          version.txt
          notes.md
        compression-level: 0
    - name: Publish
      if: needs.prepare.outputs.publish == 'true'
      shell: bash
      run: |
        # A beta is a pre-release and never the latest: only players on
        # Beta look for it
        if [ "$CHANNEL" = beta ]; then
          kind=(--prerelease --latest=false)
        else
          kind=(--latest)
        fi
        title="XBemu $LABEL"
        full=()
        if [ -n "${FULL_ZIP:-}" ]; then
          full=("$FULL_ZIP")
        fi
        if ! out=$(gh release create "$TAG" --target "$COMMIT" "${kind[@]}" \
            --title "$title" --notes-file notes.md \
            XBemu-update.zip version.txt "${full[@]}" \
            "XBemu-source-$TAG.tar.zst" 2>&1); then
          echo "::error::$(echo "$out" | tr '\n' ' ')"
          exit 1
        fi
        echo "$out"
    # A draft has no tag until it is published, and is never published: the
    # xemu release reaches players only through a hand merge pushed to main
    - name: Keep as a draft
      if: needs.prepare.outputs.draft == 'true'
      shell: bash
      run: |
        if ! out=$(gh release create "$TAG" --draft \
            --title "Test: xemu ${UPSTREAM#v} (not released)" --notes-file notes.md \
            XBemu-update.zip version.txt \
            "XBemu-source-$TAG.tar.zst" 2>&1); then
          echo "::error::$(echo "$out" | tr '\n' ' ')"
          exit 1
        fi
        echo "$out"

  # xemu's own Mac build steps (build-macos.yml), release only. Job logs need a
  # GitHub sign-in to read, so a failed build also reports its errors as
  # annotations, which anyone can read.
  mac:
    name: Build for Mac (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && contains(needs.prepare.outputs.systems, 'mac')
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      CCACHE_DIR: ${{ github.workspace }}/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: ${{ github.workspace }}/xemu-lto-cache
    steps:
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: src
    - name: Extract source package
      run: tar -xf xemu-${{ needs.prepare.outputs.version }}.tar.zst --strip-components=2
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        brew install ccache coreutils dylibbundler
        pip install pyyaml requests
    - name: Initialize compiler, library cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: |
          macos-pkgs
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-xbemu-macos-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: cache-xbemu-macos-${{ matrix.arch }}-
    - name: Setup ccache
      run: |
        echo "PATH=/opt/homebrew/opt/ccache/libexec:$PATH" >> "$GITHUB_ENV"
        mkdir -p "$CCACHE_DIR" "$LTO_CACHE_DIR"
    - name: Compile
      run: |
        # Not -e: the errors are reported below before failing
        set +e -uo pipefail
        # Keep going after a failed file (QEMU's Makefile passes -k0 to
        # ninja), so one run shows every file that does not build on Mac
        export MAKEFLAGS=k
        ./build.sh -a ${{ matrix.arch }} \
            -Db_lto=true -Db_lto_mode=thin -Db_thinlto_cache=true \
            -Db_thinlto_cache_dir="$LTO_CACHE_DIR" -Dx86_version=3 \
            2>&1 | tee full-build.log
        status=${PIPESTATUS[0]}
        if [ "$status" != 0 ]; then
          # Compiler and linker errors with the lines after them, then the
          # last lines of the log, in annotations of under 4096 characters
          # (GitHub's limit), at most 8
          { grep -E -A4 '(^FAILED: | error: |fatal error|^Undefined symbols|^ld: |^ERROR|^make: \*\*\*)' \
                full-build.log | grep -v ' warning: ' | head -n 120
            echo "----- last lines -----"
            tail -n 15 full-build.log
          } | cut -c 1-300 | sed 's/%/%25/g' | awk '
              { line = $0 "%0A" }
              length(chunk) + length(line) > 3900 { print chunk; chunk = "" }
              { chunk = chunk line }
              END { if (chunk != "") print chunk }' | head -n 8 |
          while IFS= read -r chunk; do
            echo "::error title=Mac build failed (${{ matrix.arch }})::$chunk"
          done
        fi
        exit "$status"
    - name: Package
      run: |
        cd dist
        zip -qry ../xemu-macos-${{ matrix.arch }}.zip *
    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: xemu-macos-${{ matrix.arch }}
        path: xemu-macos-${{ matrix.arch }}.zip
        compression-level: 0

  mac-universal:
    name: Join the Mac builds into one app
    needs: mac
    runs-on: macos-15
    steps:
    - name: Download both builds
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: xemu-macos-*
        merge-multiple: true
    - name: Join and sign
      run: |
        set -euo pipefail
        mkdir dist
        cd dist
        for arch in x86_64 arm64; do
          unzip -qo ../xemu-macos-${arch}.zip
          mv xemu.app/Contents/MacOS/xemu ../xemu_${arch}
        done
        lipo -create -output xemu.app/Contents/MacOS/xemu ../xemu_x86_64 ../xemu_arm64
        codesign --force --deep --preserve-metadata=entitlements,requirements,flags,runtime --sign - xemu.app/Contents/MacOS/xemu
        zip -qry ../xemu-macos-universal.zip *
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: xemu-macos-universal-release
        path: xemu-macos-universal.zip
        compression-level: 0

  mac-package:
    name: Package the Mac app
    needs: [prepare, mac-universal]
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ needs.prepare.outputs.build }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_LINE: ${{ needs.prepare.outputs.release_line }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM: ${{ needs.prepare.outputs.upstream }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
    - name: Clone the setup script and package files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        ref: ${{ needs.prepare.outputs.commit }}
        sparse-checkout: |
          xbemu/mac
          xbemu/package
          xbemu/tools
    - name: Download the Mac app
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: xemu-macos-universal-release
        path: app
    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: meta
        path: meta
    - name: Download the blank hard disk
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: blank-hdd
        path: blank
    - name: Package
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        # Same top folder as the Windows package, so the full package made
        # from this zip unzips to XBemu/ with system/ beside the app
        pkg=XBemu
        mkdir -p unpacked "$pkg"
        (cd unpacked && unzip -q ../app/*.zip)
        mv unpacked/xemu.app "$pkg/XBemu.app"
        cp xbemu/mac/README.txt "$pkg/README.txt"
        install -m 755 xbemu/mac/setup.sh "$pkg/setup.sh"
        cp xbemu/package/shader-list.bin "$pkg/shader-list.bin"
        # XBL Dashboard installer (shipped with its creator's permission):
        # setup.sh copies it to system/, and xemu runs it once
        cp "xbemu/package/XBL Dashboard Installer.iso" "$pkg/XBL Dashboard Installer.iso"
        # A test build has no build number, so the app takes any build over it
        build=""
        if [ "$PUBLISH" = true ]; then
          build="$BUILD"
        fi
        notes=$(cat meta/notes.txt 2>/dev/null || true)
        printf 'build=%s\nrelease=%s\nchannel=%s\nxemu=%s\nversion=%s\ndate=%s\ncommit=%s\nupstream=%s\nnotes=%s\n' \
            "$build" "$RELEASE_LINE" "${CHANNEL:-test}" "${UPSTREAM#v}" "$VERSION" "$(date -u +%Y-%m-%d)" "$COMMIT" "$UPSTREAM" "$notes" \
            > "$pkg/version.txt"
        { sed -n 's/^- /change=/p' meta/changes.md 2>/dev/null || true; } >> "$pkg/version.txt"
        ls -la "$pkg"
        # zip keeps the app's links and executable bits, which the artifact
        # zip around it would not
        zip -qry XBemu-mac-update.zip "$pkg"
        cp "$pkg/version.txt" mac-version.txt
        echo "sha256=$(sha256sum XBemu-mac-update.zip | cut -d' ' -f1)" >> mac-version.txt
        cat mac-version.txt
        # The full package for new players: the same folder plus the OXOS
        # BIOS and the blank console disk, which setup.sh installs
        full="XBemu-mac-${BUILD:-test}-full.zip"
        if [ "$PUBLISH" != true ]; then
          full="XBemu-mac-test-full.zip"
        fi
        bash xbemu/tools/add-full-content.sh "$pkg" blank/xbox_hdd.qcow2 xbemu/package/oxos.txt
        zip -qry "$full" "$pkg"
        ls -l "$full"
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: XBemu-mac
        path: |
          XBemu-mac-update.zip
          XBemu-mac-*-full.zip
          mac-version.txt
        compression-level: 0

  mac-publish:
    name: Add the Mac app to the release
    needs: [prepare, release, mac-package]
    # A partial build without the Mac copies the newest release's Mac files
    if: always() && needs.release.result == 'success' && (needs.mac-package.result == 'success' || !contains(needs.prepare.outputs.systems, 'mac')) && (needs.prepare.outputs.publish == 'true' || needs.prepare.outputs.draft == 'true')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Not the upstream remote, which gh would prefer
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
    steps:
    - name: Download the Mac app
      if: contains(needs.prepare.outputs.systems, 'mac')
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: XBemu-mac
    - name: Copy the Mac files of the build before
      if: "!contains(needs.prepare.outputs.systems, 'mac')"
      run: gh release download "$PREV_TAG" --pattern mac-version.txt --pattern XBemu-mac-update.zip --pattern 'XBemu-mac-*-full.zip'
    - name: Clone the notes script
      if: needs.prepare.outputs.publish == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        ref: ${{ needs.prepare.outputs.commit }}
        path: repo
        sparse-checkout: |
          xbemu/tools
    - name: Download release notes
      if: needs.prepare.outputs.publish == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: meta
        path: meta
    - name: Publish
      run: |
        set -euo pipefail
        files=(XBemu-mac-update.zip mac-version.txt)
        full=$(ls XBemu-mac-*-full.zip 2>/dev/null | head -n 1 || true)
        if [ -n "$full" ]; then
          files+=("$full")
        fi
        if ! out=$(gh release upload "$TAG" "${files[@]}" 2>&1); then
          echo "::error::$(echo "$out" | tr '\n' ' ')"
          exit 1
        fi
        echo "$out"
    # The whole notes again, now with this system's download in the table
    - name: Write the release notes again
      if: needs.prepare.outputs.publish == 'true'
      env:
        SYSTEMS: ${{ needs.prepare.outputs.systems }}
        IMAGES_REF: ${{ needs.prepare.outputs.commit }}
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        mkdir -p rel
        gh release download "$TAG" --pattern version.txt --dir rel
        mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
        bash repo/xbemu/tools/release-notes.sh rel/version.txt meta/changes.md "${assets[@]}" > notes.md
        cat notes.md
        gh release edit "$TAG" --notes-file notes.md

  # xemu's own Linux build steps (build-linux.yml), x86_64 release only. The
  # app is the AppDir linuxdeploy makes (the program with its libraries, run
  # by its AppRun), not an AppImage: an AppImage needs FUSE 2, which newer
  # systems no longer have.
  linux:
    name: Build for Linux
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && contains(needs.prepare.outputs.systems, 'linux')
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: /tmp/xemu-lto-cache
      LTO_CACHE_MAXSIZE: 512m
      DEB_BUILD_MAINT_OPTIONS: optimize=-lto
      DEB_LDFLAGS_MAINT_APPEND: -Wl,--build-id=sha1
      CC: ccache clang-21
      CXX: ccache clang++-21
      CC_LD: lld-21
      CXX_LD: lld-21
      AR: llvm-ar-21
      RANLIB: llvm-ranlib-21
      NM: llvm-nm-21
    steps:
    - name: Initialize compiler cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: |
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-xbemu-linux-${{ github.sha }}
        restore-keys: cache-xbemu-linux-
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: src
    - name: Extract source package
      run: |
        mkdir src
        tar -xf xemu-${{ needs.prepare.outputs.version }}.tar.zst -C src --strip-components=2
        printf 'xemu (1:0.0.0-0) unstable; urgency=medium\n\n  Built from %s\n\n -- XBemu <noreply@github.com>  %s\n' \
            "${{ needs.prepare.outputs.version }}" "$(date -R)" > src/debian/changelog
    - name: Install dependencies
      env:
        POOL: https://apt.llvm.org/jammy/pool/main/l/llvm-toolchain-21/
      run: |
        set -euxo pipefail
        sudo apt-get -qy update
        sudo apt-get install -qy ccache libusb-1.0-0-dev
        (cd src && sudo apt-get -qy build-dep .)
        # LLVM 21, as xemu's own Linux build: the newest version in the pool
        html="$(curl -fsSL --compressed "$POOL")"
        ver="$(grep -oE 'libllvm21_[0-9][^"]+_amd64\.deb' <<<"$html" | head -n1 |
               sed -E 's/^libllvm21_//; s/_amd64\.deb$//')"
        mkdir -p /tmp/llvm21 && cd /tmp/llvm21
        for pkg in clang-21 clang-tools-21 lld-21 libllvm21 libclang-cpp21 \
            libclang-common-21-dev libclang1-21 libclang-rt-21-dev llvm-21 \
            llvm-21-dev llvm-21-linker-tools llvm-21-runtime llvm-21-tools; do
          curl -fsSLO "${POOL}${pkg}_${ver}_amd64.deb"
        done
        sudo apt-get install -y --no-install-recommends ./*.deb
        echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
    - name: Compile
      run: |
        # Not -e: the errors are reported below before failing
        set +e -uo pipefail
        mkdir -p "$CCACHE_DIR" "$LTO_CACHE_DIR"
        # dpkg-genbuildinfo takes minutes on GitHub runners
        sudo ln -sf /bin/true /usr/bin/dpkg-genbuildinfo
        export XEMU_BUILD_OPTIONS="--extra-ldflags=-Wl,--thinlto-cache-policy=cache_size_bytes=$LTO_CACHE_MAXSIZE -Db_lto=true -Db_lto_mode=thin -Db_thinlto_cache=true -Db_thinlto_cache_dir=$LTO_CACHE_DIR -Dx86_version=3"
        (cd src && dpkg-buildpackage --no-sign -b) 2>&1 | tee full-build.log
        status=${PIPESTATUS[0]}
        if [ "$status" != 0 ]; then
          grep -E -A4 '(^FAILED: | error: |fatal error|undefined reference)' full-build.log |
              head -n 40 | cut -c 1-300 | while IFS= read -r line; do
            echo "::error title=Linux build failed::$line"
          done
        fi
        exit "$status"
    - name: Make the app folder
      run: |
        set -euo pipefail
        wget --no-verbose https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        mkdir deb app
        (cd deb && ar x ../xemu_*.deb)
        tar -C app -xf deb/data.tar*
        # The host's GLib, as xemu's AppImage: libdecor's GTK plugin fails
        # against an older bundled one. libusb too: linuxdeploy leaves it to
        # the system, and not every system has it
        ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir app \
            --exclude-library 'libglib-2.0.so*' \
            --library /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0
        ls -la app
        test -x app/AppRun
        test -f app/usr/lib/libusb-1.0.so.0
        tar -czf xemu-linux-app.tar.gz app
    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: xemu-linux
        path: xemu-linux-app.tar.gz
        compression-level: 0

  linux-package:
    name: Package the Linux app
    needs: [prepare, linux]
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ needs.prepare.outputs.build }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_LINE: ${{ needs.prepare.outputs.release_line }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM: ${{ needs.prepare.outputs.upstream }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
    - name: Clone the setup script and package files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        ref: ${{ needs.prepare.outputs.commit }}
        sparse-checkout: |
          xbemu/linux
          xbemu/package
          xbemu/tools
    - name: Download the Linux app
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: xemu-linux
    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: meta
        path: meta
    - name: Download the blank hard disk
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: blank-hdd
        path: blank
    - name: Package
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        # Same top folder as the Windows package, so the full package made
        # from this unpacks to XBemu/ with system/ beside the app
        pkg=XBemu
        mkdir -p "$pkg"
        tar -xzf xemu-linux-app.tar.gz -C "$pkg"
        cp xbemu/linux/README.txt "$pkg/README.txt"
        install -m 755 xbemu/linux/setup.sh "$pkg/setup.sh"
        cp xbemu/package/shader-list.bin "$pkg/shader-list.bin"
        # XBL Dashboard installer (shipped with its creator's permission):
        # setup.sh copies it to system/, and xemu runs it once
        cp "xbemu/package/XBL Dashboard Installer.iso" "$pkg/XBL Dashboard Installer.iso"
        # A test build has no build number, so the app takes any build over it
        build=""
        if [ "$PUBLISH" = true ]; then
          build="$BUILD"
        fi
        notes=$(cat meta/notes.txt 2>/dev/null || true)
        printf 'build=%s\nrelease=%s\nchannel=%s\nxemu=%s\nversion=%s\ndate=%s\ncommit=%s\nupstream=%s\nnotes=%s\n' \
            "$build" "$RELEASE_LINE" "${CHANNEL:-test}" "${UPSTREAM#v}" "$VERSION" "$(date -u +%Y-%m-%d)" "$COMMIT" "$UPSTREAM" "$notes" \
            > "$pkg/version.txt"
        { sed -n 's/^- /change=/p' meta/changes.md 2>/dev/null || true; } >> "$pkg/version.txt"
        ls -la "$pkg"
        # tar keeps the app's links and executable bits, which the artifact
        # zip around it would not
        tar -czf XBemu-linux-update.tar.gz "$pkg"
        cp "$pkg/version.txt" linux-version.txt
        echo "sha256=$(sha256sum XBemu-linux-update.tar.gz | cut -d' ' -f1)" >> linux-version.txt
        cat linux-version.txt
        # The full package for new players: the same folder plus the OXOS
        # BIOS and the blank console disk, which setup.sh installs
        full="XBemu-linux-${BUILD:-test}-full.tar.gz"
        if [ "$PUBLISH" != true ]; then
          full="XBemu-linux-test-full.tar.gz"
        fi
        bash xbemu/tools/add-full-content.sh "$pkg" blank/xbox_hdd.qcow2 xbemu/package/oxos.txt
        tar -czf "$full" "$pkg"
        ls -l "$full"
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: XBemu-linux
        path: |
          XBemu-linux-update.tar.gz
          XBemu-linux-*-full.tar.gz
          linux-version.txt
        compression-level: 0

  linux-publish:
    name: Add the Linux app to the release
    needs: [prepare, release, linux-package, mac-publish]
    # After the Mac app (or its failure), so the two never edit the notes at
    # once
    # A partial build without Linux copies the newest release's Linux files
    if: always() && needs.release.result == 'success' && (needs.linux-package.result == 'success' || !contains(needs.prepare.outputs.systems, 'linux')) && (needs.prepare.outputs.publish == 'true' || needs.prepare.outputs.draft == 'true')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Not the upstream remote, which gh would prefer
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
    steps:
    - name: Download the Linux app
      if: contains(needs.prepare.outputs.systems, 'linux')
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: XBemu-linux
    - name: Copy the Linux files of the build before
      if: "!contains(needs.prepare.outputs.systems, 'linux')"
      run: gh release download "$PREV_TAG" --pattern linux-version.txt --pattern XBemu-linux-update.tar.gz --pattern 'XBemu-linux-*-full.tar.gz'
    - name: Clone the notes script
      if: needs.prepare.outputs.publish == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        ref: ${{ needs.prepare.outputs.commit }}
        path: repo
        sparse-checkout: |
          xbemu/tools
    - name: Download release notes
      if: needs.prepare.outputs.publish == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: meta
        path: meta
    - name: Publish
      run: |
        set -euo pipefail
        files=(XBemu-linux-update.tar.gz linux-version.txt)
        full=$(ls XBemu-linux-*-full.tar.gz 2>/dev/null | head -n 1 || true)
        if [ -n "$full" ]; then
          files+=("$full")
        fi
        if ! out=$(gh release upload "$TAG" "${files[@]}" 2>&1); then
          echo "::error::$(echo "$out" | tr '\n' ' ')"
          exit 1
        fi
        echo "$out"
    # The whole notes again, now with this system's download in the table
    - name: Write the release notes again
      if: needs.prepare.outputs.publish == 'true'
      env:
        SYSTEMS: ${{ needs.prepare.outputs.systems }}
        IMAGES_REF: ${{ needs.prepare.outputs.commit }}
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        mkdir -p rel
        gh release download "$TAG" --pattern version.txt --dir rel
        mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
        bash repo/xbemu/tools/release-notes.sh rel/version.txt meta/changes.md "${assets[@]}" > notes.md
        cat notes.md
        gh release edit "$TAG" --notes-file notes.md
