name: Idea or request
description: Something XBemu could do better or do next
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Look in the [open issues](https://github.com/Rubyxm88/XBemu/issues) first, in case someone asked already.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like XBemu to do, and why? Screenshots or mock-ups are welcome.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Any way you get around it now, if there is one.
  - type: dropdown
    id: system
    attributes:
      label: Your computer
      multiple: true
      options:
        - Windows
        - Mac
        - Linux / Steam Deck
